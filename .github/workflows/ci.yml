name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Tests & Evals
    runs-on: ubuntu-latest

    services:
      falkordb:
        image: falkordb/falkordb:v4.22.1
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping | grep -q PONG"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Seed FalkorDB Graph
        run: python seed/seed_graph.py --reset

      - name: Run Pytest Test Suite
        env:
          FALKORDB_HOST: localhost
          FALKORDB_PORT: 6379
        run: pytest -v

      - name: Run Scenario Evaluation Benchmark
        env:
          FALKORDB_HOST: localhost
          FALKORDB_PORT: 6379
        run: python -m evals.eval_harness

  frontend:
    name: Frontend Build & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Dependencies
        run: npm --prefix frontend ci

      - name: Run Vitest Unit Tests
        run: npm --prefix frontend test

      - name: Typecheck and Build Web Production Bundle
        run: npm --prefix frontend run build
